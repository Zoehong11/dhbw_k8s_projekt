apiVersion: v1
kind: ConfigMap
metadata:
  name: linklib-backend-dashboard
  namespace: linklib
  labels:
    grafana_dashboard: "1"
data:
  linklib-backend.json: |
    {
      "title": "Link Library - Backend",
      "uid": "linklib-backend",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Request rate by endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum by (handler) (rate(http_requests_total{job=\"backend\"}[5m]))",
              "legendFormat": "{{handler}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Error rate (5xx)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"backend\",status=~\"5..\"}[5m]))",
              "legendFormat": "5xx / s"
            }
          ]
        },
        {
          "id": 3,
          "title": "p95 request latency",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, handler) (rate(http_request_duration_seconds_bucket{job=\"backend\"}[5m])))",
              "legendFormat": "{{handler}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Backend pods up",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "sum(up{job=\"backend\"})",
              "legendFormat": "pods up"
            }
          ]
        }
      ]
    }

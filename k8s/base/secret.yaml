# Dev/demo credentials only — for a real deployment these would come from a
# secret manager (e.g. Sealed Secrets, External Secrets Operator, Vault),
# never committed to git.
apiVersion: v1
kind: Secret
metadata:
  name: linklib-secrets
  namespace: linklib
type: Opaque
stringData:
  POSTGRES_USER: linklib
  POSTGRES_PASSWORD: linklib
  POSTGRES_DB: linklib
  DATABASE_URL: postgresql+psycopg://linklib:linklib@postgres:5432/linklib
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: changeme
  JWT_SECRET: change-this-in-a-real-deployment

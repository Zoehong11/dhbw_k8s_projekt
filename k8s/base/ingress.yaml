apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linklib
  namespace: linklib
spec:
  ingressClassName: nginx
  rules:
    - host: linklib.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /readyz
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080

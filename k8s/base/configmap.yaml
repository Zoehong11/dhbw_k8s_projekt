apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: linklib
data:
  CORS_ORIGINS: "http://linklib.local"
  JWT_EXPIRES_MINUTES: "1440"
  SCRAPE_TIMEOUT_SECONDS: "8"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: linklib
data:
  # Same-origin: the browser talks to /api on whatever host it loaded the
  # page from, and the Ingress routes that path to the backend service.
  API_URL: ""
